---
name: Devenv Update

# prettier-ignore
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate dependency updates without creating a pull request
        type: boolean
        default: false

concurrency:
  group: devenv-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------
  # Update Devenv Dependencies
  # -------------------------------------------------
  update:
    name: Update Devenv Dependencies
    uses: tars-cloud/actions/.github/workflows/devenv-update.yaml@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
    with:
      runner-architecture: AMD64
      timeout-minutes: 120
      submodules: true
      branch: update-devenv-lock
      title: "chore: Update devenv.lock"
      labels: dependencies,semver none
      assignees: MAHDTech
      reviewers: MAHDTech
      dry-run: ${{ inputs.dry_run || false }}
    secrets:
      client-id: ${{ secrets.CI_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
