---
name: Devenv CI

# prettier-ignore
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - master
      - trunk
  push:
    branches:
      - main
      - master
      - trunk
  workflow_dispatch: {}

concurrency:
  group: devenv-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  # -------------------------------------------------
  # Devenv CI
  # -------------------------------------------------
  ci:
    name: Devenv CI - AMD64
    uses: tars-cloud/actions/.github/workflows/devenv-ci.yaml@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
    with:
      runs-on: >-
        ${{ (github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') &&
        '"ubuntu-24.04"' || '' }}
      runner-architecture: AMD64
      job-name: Devenv CI - AMD64
      timeout-minutes: 120
      submodules: true
      cache-tools: none
      lint-command: prek run --all-files --show-diff-on-failure
