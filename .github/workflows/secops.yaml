---
name: SecOps

# prettier-ignore
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - master
      - trunk
  pull_request:
    branches:
      - main
      - master
      - trunk
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch: {}

concurrency:
  group: secops-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  # -------------------------------------------------
  # Trivy Scan
  # -------------------------------------------------
  trivy:
    name: Trivy Scan
    uses: tars-cloud/actions/.github/workflows/trivy.yaml@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
    with:
      runs-on: >-
        ${{ (github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') &&
        '"ubuntu-24.04"' || '' }}
      runner-architecture: AMD64
      timeout-minutes: 120
      submodules: true
      config-file: trivy.yaml
      gate-config-file: .github/trivy/gate.yaml
    secrets:
      TARS_CLOUD_S3_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_ACCESS_KEY }}
      TARS_CLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_SECRET_ACCESS_KEY }}

  # -------------------------------------------------
  # CodeQL Analysis
  # -------------------------------------------------
  codeql:
    name: CodeQL Analysis
    uses: tars-cloud/actions/.github/workflows/codeql.yaml@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
    with:
      runs-on: >-
        ${{ (github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') &&
        '"ubuntu-24.04"' || '' }}
      runner-architecture: AMD64
      type: devenv
      timeout-minutes: 360
      languages: '["actions"]'
    secrets:
      TARS_CLOUD_S3_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_ACCESS_KEY }}
      TARS_CLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_SECRET_ACCESS_KEY }}
